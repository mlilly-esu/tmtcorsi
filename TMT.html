<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">

    <!-- jsPsych library -->
    <script src="jspsych/jspsych.js"></script>

    <!-- jsPsych plugins used by this experiment -->
    <script src="jspsych/plugins/jspsych-fullscreen.js"></script>
    <script src="jspsych/plugins/jspsych-instructions_modified.js"></script>
    <script src="jspsych/plugins/jspsych-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/jspsych-tmt-trial.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #1d1d1f;
        }

        .jspsych-display-element {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tmt-card {
            max-width: 680px;
            margin: 40px auto;
            padding: 40px 48px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            line-height: 1.7;
        }

        .tmt-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #14213d;
        }

        .tmt-card p {
            font-size: 18px;
            margin: 0 0 16px;
        }

        .tmt-card p.tmt-emphasis {
            font-weight: 600;
            color: #14213d;
        }

        .jspsych-btn, .jspsych-fullscreen button, #jspsych-fullscreen-btn {
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .jspsych-btn:hover {
            background: #1d4fd1;
        }

        .jspsych-instructions-nav {
            margin-top: 24px;
        }

        .jspsych-instructions-pagenum {
            font-size: 15px;
            color: #6b7280;
            margin-top: 10px;
        }
    </style>
</head>
<body></body>
<script>

// ---------------------------------------------------------------
// Prolific tracking: pull PROLIFIC_PID / STUDY_ID / SESSION_ID out
// of the URL so they get attached to every row of data.
// Prolific appends these automatically to the link you give
// participants, e.g. ...?PROLIFIC_PID=abc123&STUDY_ID=xyz&SESSION_ID=999
// ---------------------------------------------------------------
var urlParams = new URLSearchParams(window.location.search);
var prolific_pid = urlParams.get('PROLIFIC_PID') || 'unknown';
var study_id = urlParams.get('STUDY_ID') || 'unknown';
var session_id = urlParams.get('SESSION_ID') || 'unknown';

// ---------------------------------------------------------------
// Where the data goes and where participants go next.
// ---------------------------------------------------------------
const DATAPIPE_EXPERIMENT_ID = "PGH139IF9EXO";
const CORSI_REDIRECT_URL = "Corsi.html";

// Prevent space bar from scrolling the page during the experiment
window.onkeydown = function (e) {
    return e.keyCode !== 32;
};

// ** Experiment blocks **

var fullscreenTrial = {
    type: 'fullscreen',
    fullscreen_mode: true,
    message: `<div class="tmt-card">
        <h2>Before you begin</h2>
        <p>This task works best in fullscreen mode.</p>
        <p>Click the button below to continue.</p>
    </div>`,
    button_label: 'Continue to fullscreen'
};

// ---- Part A ----
var instructions_partA = {
    type: 'instructions',
    pages: [
        `<div class="tmt-card">
            <h2>Part A</h2>
            <p>You will see numbered circles scattered on the screen.</p>
            <p class="tmt-emphasis">Click the circles in order: 1, 2, 3, and so on.</p>
            <p>Work as quickly and accurately as you can.</p>
            <p>Press Next when you're ready to begin.</p>
        </div>`
    ],
    show_clickable_nav: true,
    button_label_previous: 'Previous',
    button_label_next: 'Next'
};

var fixation_partA = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:60px;color:#1d1d1f;">+</p>',
    choices: jsPsych.NO_KEYS,
    trial_duration: 1000
};

var partA_labels = [];
for (let n = 1; n <= 20; n++) partA_labels.push(String(n));

var trial_partA = {
    type: 'tmt-trial',
    labels: partA_labels,
    data_part_label: 'A'
};

// ---- Part B ----
var instructions_partB = {
    type: 'instructions',
    pages: [
        `<div class="tmt-card">
            <h2>Part B</h2>
            <p>Now you will see circles with both numbers (1–10) and letters (A–J).</p>
            <p class="tmt-emphasis">Click them in alternating order: 1, A, 2, B, 3, C, and so on.</p>
            <p>Work as quickly and accurately as you can.</p>
            <p>Press Next when you're ready to begin.</p>
        </div>`
    ],
    show_clickable_nav: true,
    button_label_previous: 'Previous',
    button_label_next: 'Next'
};

var fixation_partB = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:60px;color:#1d1d1f;">+</p>',
    choices: jsPsych.NO_KEYS,
    trial_duration: 1000
};

var partB_labels = [];
for (let n = 1; n <= 10; n++) {
    partB_labels.push(String(n));
    partB_labels.push(String.fromCharCode(64 + n)); // A, B, C, ... J
}

var trial_partB = {
    type: 'tmt-trial',
    labels: partB_labels,
    data_part_label: 'B'
};

var greetings = {
    type: "html-keyboard-response",
    stimulus: `<div class="tmt-card">
        <h2>You're all set</h2>
        <p>This part of the study is complete.</p>
        <p>Thank you for participating!</p>
        <p>Press any key to continue.</p>
    </div>`
};

jsPsych.init({
    timeline: [
        fullscreenTrial,
        instructions_partA,
        fixation_partA,
        trial_partA,
        instructions_partB,
        fixation_partB,
        trial_partB,
        greetings
    ],

    // Attach the Prolific identifiers to every row of data
    on_finish: function () {

        jsPsych.data.addProperties({
            prolific_pid: prolific_pid,
            study_id: study_id,
            session_id: session_id
        });

        let CSV = jsPsych.data.get().csv();

        function goToCorsi() {
            var separator = CORSI_REDIRECT_URL.indexOf("?") === -1 ? "?" : "&";
            window.location.href = CORSI_REDIRECT_URL + separator +
                "PROLIFIC_PID=" + encodeURIComponent(prolific_pid) +
                "&STUDY_ID=" + encodeURIComponent(study_id) +
                "&SESSION_ID=" + encodeURIComponent(session_id);
        }

        // Only save data when a real Prolific ID is present. Without one,
        // someone opened this page directly (not via Prolific/Qualtrics),
        // so skip creating a junk row in DataPipe/Google Drive and just
        // send them on to Corsi.
        if (prolific_pid === "unknown") {
            console.warn("No PROLIFIC_PID found in URL — skipping DataPipe save.");
            goToCorsi();
        } else {
            fetch("https://pipe.jspsych.org/api/data/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    experimentID: DATAPIPE_EXPERIMENT_ID,
                    filename: `${prolific_pid}_${Date.now()}.csv`,
                    data: CSV
                })
            })
            .then(() => goToCorsi())
            .catch((error) => {
                console.error("DataPipe save failed:", error);
                goToCorsi();
            });
        }
    },

    // Minimum browser size values
    exclusions: {
        min_width: 900,
        min_height: 700
    }
});
</script>
</html>
