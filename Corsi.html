<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Corsi Block Task</title>

    <link rel="stylesheet" href="corsi-lib/css/jspsych.css">
    <script src="corsi-lib/jspsych.js"></script>
    <script src="corsi-lib/plugins/jspsych-fullscreen.js"></script>
    <script src="corsi-lib/plugins/jspsych-html-keyboard-response.js"></script>
    <script src="corsi-lib/plugins/jspsych-html-button-response.js"></script>
    <script src="corsi-lib/plugins/jspsych-corsi-trial.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #1d1d1f;
        }

        .jspsych-display-element {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tmt-card {
            max-width: 680px;
            margin: 40px auto;
            padding: 40px 48px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            line-height: 1.7;
        }

        .tmt-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #14213d;
        }

        .tmt-card p {
            font-size: 18px;
            margin: 0 0 16px;
        }

        .tmt-card p.tmt-emphasis {
            font-weight: 600;
            color: #14213d;
        }

        .jspsych-btn, #jspsych-fullscreen-btn {
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .jspsych-btn:hover {
            background: #1d4fd1;
        }

        .jspsych-instructions-nav {
            margin-top: 24px;
        }

        .jspsych-instructions-pagenum {
            font-size: 15px;
            color: #6b7280;
            margin-top: 10px;
        }
    </style>
</head>
<body></body>
<script>

// ---------------------------------------------------------------
// Prolific tracking: pull PROLIFIC_PID / STUDY_ID / SESSION_ID out
// of the URL so they get attached to every row of data.
// ---------------------------------------------------------------
var urlParams = new URLSearchParams(window.location.search);
var prolific_pid = urlParams.get('PROLIFIC_PID') || 'unknown';
var study_id = urlParams.get('STUDY_ID') || 'unknown';
var session_id = urlParams.get('SESSION_ID') || 'unknown';

// ---------------------------------------------------------------
// Config
// ---------------------------------------------------------------
const DATAPIPE_EXPERIMENT_ID = "PGH139IF9EXO";
// Once your real Prolific study exists, replace this with the real
// Prolific completion URL (Settings > Study Completion Codes on Prolific).
const PROLIFIC_COMPLETION_URL = "https://app.prolific.com/submissions/complete?cc=CHZKKIBH";

// Board setup — fewer, smaller squares in a bounded area (not the full screen)
const NUM_ITEMS = 9;

// Adaptive span staircase state
var currentSpan = 2;      // starting span length
var maxSpan = NUM_ITEMS;  // can't test a span longer than the number of squares
var corsiSpanScore = 0;   // highest span passed (>=1/2 correct)
var trialsCorrectAtSpan = 0;

// ** Experiment blocks **

var FullScreenOn = {
    type: 'fullscreen',
    fullscreen_mode: true,
    message: `<div class="tmt-card">
        <h2>Before you begin</h2>
        <p>This task works best in fullscreen mode.</p>
        <p>Click the button below to continue.</p>
    </div>`,
    button_label: 'Continue to fullscreen'
};

var instructions = {
    type: 'html-button-response',
    stimulus: `<div class="tmt-card">
        <h2>Instructions</h2>
        <p>You will see a board of squares.</p>
        <p>A few squares will light up one at a time — watch closely.</p>
        <p class="tmt-emphasis">After they finish, click the squares in the same order they lit up.</p>
        <p>The sequence starts short and gets longer as you go.</p>
    </div>`,
    choices: ['Begin']
};

var fixation = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:60px;color:#1d1d1f;">+</p>',
    choices: jsPsych.NO_KEYS,
    trial_duration: 800
};

var corsi_trial = {
    type: 'corsi-trial',
    num_items: NUM_ITEMS,
    span: function () { return currentSpan; },
    on_finish: function (data) {
        if (data.correct) trialsCorrectAtSpan++;
    }
};

// Three trials at the current span length
var span_block = {
    timeline: [fixation, corsi_trial],
    repetitions: 3
};

// Keep testing increasing spans as long as the participant passes
// (at least 2 of 3 trials correct) at each span level.
var corsi_loop = {
    timeline: [span_block],
    loop_function: function () {
        if (trialsCorrectAtSpan >= 2) {
            corsiSpanScore = currentSpan;
            currentSpan++;
            trialsCorrectAtSpan = 0;
            if (currentSpan > maxSpan) return false; // reached the ceiling
            return true; // test the next, longer span
        } else {
            return false; // failed this span (fewer than 2 of 3 correct) — stop here
        }
    }
};

var SayBye = {
    type: 'html-keyboard-response',
    stimulus: `<div class="tmt-card">
        <h2>You're all set</h2>
        <p>This task is complete.</p>
        <p>Thank you for participating!</p>
        <p>Press any key to submit your data and continue.</p>
    </div>`
};

jsPsych.init({
    timeline: [FullScreenOn, instructions, corsi_loop, SayBye],

    on_finish: function () {

        // Build ONE summary row per participant
        var trials = jsPsych.data.get().filter({trial_type: 'corsi-trial'}).values();
        var correctCount = trials.filter(function (t) { return t.correct === true; }).length;
        function csvCell(v) {
            return '"' + String(v).replace(/"/g, '""') + '"';
        }
        var header = ["prolific_pid", "corsi_span_score", "total_correct_trials", "total_trials"];
        var values = [prolific_pid, corsiSpanScore, correctCount, trials.length];
        let CSV = header.map(csvCell).join(",") + "\r\n" + values.map(csvCell).join(",");

        function goToProlific() {
            window.location.href = PROLIFIC_COMPLETION_URL;
        }

        // Only save data when a real Prolific ID is present. Without one,
        // someone opened this page directly (not via Qualtrics/Prolific),
        // so skip creating a junk row in DataPipe/Google Drive.
        if (prolific_pid === "unknown") {
            console.warn("No PROLIFIC_PID found in URL — skipping DataPipe save.");
            goToProlific();
        } else {
            fetch("https://pipe.jspsych.org/api/data/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    experimentID: DATAPIPE_EXPERIMENT_ID,
                    filename: `${prolific_pid}_corsi_${Date.now()}.csv`,
                    data: CSV
                })
            })
            .then(() => goToProlific())
            .catch((error) => {
                console.error("DataPipe save failed:", error);
                goToProlific();
            });
        }
    }
});
</script>
</html>
